name: deploy

on:
  push:
    branches: [main]

jobs:
  # ─── 1. Tests obligatoires avant tout déploiement ────────────────────────
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --no-coverage

  # ─── 2. Déploiement → Render ─────────────────────────────────────────────
  # Render se connecte directement à GitHub et redéploie automatiquement.
  # Ce job déclenche un déploiement immédiat via le deploy hook (optionnel).
  # Pour l'activer : ajouter RENDER_DEPLOY_HOOK dans les secrets GitHub.
  # (Dashboard Render → ton service → Settings → Deploy Hook → Copy URL)
  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -s "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK non configuré – Render redéploie automatiquement via l'intégration GitHub"
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
