services:
  - type: web
    name: z-animex
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    # serversideup/php écoute sur 8080 par défaut
    # PORT est transmis automatiquement par Render → NGINX_HTTP_PORT dans start.sh
    envVars:
      - key: APP_NAME
        value: Z-Animex
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false          # à définir dans le dashboard Render après le premier déploiement
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: z-animex-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: z-animex-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: z-animex-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: z-animex-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: z-animex-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: TELESCOPE_ENABLED
        value: "false"
    # disk nécessite un plan payant (Starter $7/mo) — retirer si plan gratuit
    # disk:
    #   name: z-animex-storage
    #   mountPath: /var/www/html/storage
    #   sizeGB: 1

databases:
  - name: z-animex-db
    plan: free
    databaseName: z_animex
    user: z_animex
